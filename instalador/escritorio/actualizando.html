<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>FactPOS · Actualizando</title>
<style>
  body { margin: 0; font: 14px "Segoe UI", system-ui, sans-serif; background: #102b3a; color: #e8f1f6; display: flex; flex-direction: column; justify-content: center; height: 100vh; padding: 0 28px; box-sizing: border-box; user-select: none; }
  h1 { font-size: 17px; margin: 0 0 6px; font-weight: 600; }
  #paso { margin: 0 0 14px; min-height: 20px; color: #bcd3df; }
  .barra { height: 10px; border-radius: 999px; background: #1d4157; overflow: hidden; position: relative; }
  .barra b { display: block; height: 100%; width: 4%; background: #2dd4bf; border-radius: 999px; transition: width .6s ease; }
  .barra.indef b { position: absolute; width: 35%; animation: mov 1.3s ease-in-out infinite; }
  @keyframes mov { 0% { left: -35%; } 100% { left: 100%; } }
  small { margin-top: 14px; color: #8fb0c1; }
  .error b { background: #f59e0b; }
</style></head>
<body>
  <h1 id="titulo">Actualizando FactPOS…</h1>
  <p id="paso">Preparando…</p>
  <div class="barra indef" id="barra"><b id="b"></b></div>
  <small>No apague el equipo. Al terminar, el sistema se abre solo y le pedirá su usuario y contraseña.</small>
<script>
  const $ = id => document.getElementById(id);
  window.factpos.alActualizar(m => {
    if (m.destino) $('titulo').textContent = 'Actualizando FactPOS a la versión ' + m.destino;
    if (m.paso) $('paso').textContent = m.reiniciando ? 'Reiniciando el servidor…' : m.paso;
    const indef = m.porcentaje == null || m.reiniciando;
    $('barra').classList.toggle('indef', indef);
    $('barra').classList.toggle('error', m.final && m.ok === false);
    if (!indef) $('b').style.width = Math.max(4, m.porcentaje) + '%';
    if (m.final) $('titulo').textContent = m.ok ? 'Listo' : 'Atención';
  });
</script>
</body></html>
