<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Importador FactPOS</title>
<style>
:root{--p:#0f766e;--t:#122130;--s:#5a6b7c;--b:#d2dae3;--f:#eef2f6}
*{box-sizing:border-box}body{margin:0;background:var(--f);color:var(--t);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px}h1{margin:0 0 12px;font-size:22px}h1 b{color:var(--p)}
.s{color:var(--s)}.tarjeta{background:#fff;border:1px solid var(--b);border-radius:14px;padding:16px}
label{display:block;font-size:13px;color:var(--s);margin:9px 0 3px}
input[type=text],input[type=password]{width:100%;padding:9px 11px;border:1px solid var(--b);border-radius:9px;font:inherit}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.fila{grid-template-columns:1fr}}
button{font:inherit;font-weight:700;border-radius:11px;padding:12px 16px;border:1px solid var(--p);background:var(--p);color:#fff;cursor:pointer;width:100%;margin-top:14px}
button:disabled{opacity:.4;cursor:not-allowed}
pre{background:#0f1d29;color:#d8e6f0;border-radius:10px;padding:12px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;margin:12px 0 0}
a{color:var(--p)}details{margin-top:10px}summary{cursor:pointer;color:var(--s)}
.zona{border:2px dashed var(--b);border-radius:12px;padding:22px;text-align:center;cursor:pointer}.zona.si{border-color:var(--p);background:#f0fbf9}
.res{margin-top:10px;font-weight:600}
</style></head><body><main>
<h1>Importador <b>FactPOS</b></h1>
<div class="tarjeta">
 <div class="zona" id="zona"><b>Cargar el archivo .sql</b><br><span class="s" id="nombre">Haga clic o arrástrelo aquí</span></div>
 <input type="file" id="arch" accept=".sql,.txt" hidden>
 <div class="res" id="res"></div>
 <div id="datos" hidden>
  <label>Servidor de FactPOS</label><input type="text" id="servidor" placeholder="Dirección de la PC del servidor (se busca sola)"><small id="hallado" class="s"></small>
  <div class="fila"><div><label>Usuario administrador</label><input type="text" id="usuario"></div><div><label>Contraseña</label><input type="password" id="clave"></div></div>
  <details><summary>Más opciones</summary>
   <div class="fila"><div><label>RNC de la empresa (si el usuario está en varias)</label><input type="text" id="rnc"></div><div><label>Código de verificación (dos pasos)</label><input type="text" id="codigo"></div></div>
   <label>Sucursal que recibe la existencia (vacío = la primera)</label><input type="text" id="sucursal">
   <label style="display:flex;gap:8px;align-items:center;color:var(--t)"><input type="checkbox" id="sinfotos"> No importar las fotos</label>
  </details>
  <button id="procesar">Procesar y cargar a FactPOS</button>
 </div>
 <pre id="log" hidden></pre><p id="enlaces" class="s"></p>
</div></main>
<script>
const $=i=>document.getElementById(i);let ocupado=false;
async function correr(aplicar){ocupado=true;$("procesar").disabled=true;$("log").hidden=false;$("log").textContent="Procesando…\n";$("enlaces").textContent="";
 const o={aplicar,servidor:$("servidor").value,usuario:$("usuario").value,clave:$("clave").value,rnc:$("rnc").value,codigo:$("codigo").value,sucursal:$("sucursal").value,sinFotos:$("sinfotos").checked};
 let texto="";
 try{const r=await fetch("/ejecutar",{method:"POST",body:JSON.stringify(o)});
  if(!r.ok){texto=(await r.json()).error}else{const d=r.body.getReader(),t=new TextDecoder();$("log").textContent="";
   for(;;){const{done,value}=await d.read();if(done)break;const c=t.decode(value);texto+=c;$("log").textContent+=c;$("log").scrollTop=1e9}}
 }catch(e){texto="Error: "+e.message;$("log").textContent=texto}
 ocupado=false;$("procesar").disabled=false;
 const s=await(await fetch("/estado")).json();
 $("enlaces").innerHTML=s.archivos.length?"Informes en <b>"+s.salida+"</b>: "+s.archivos.map(a=>`<a href="/salida/${encodeURIComponent(a)}">${a}</a>`).join(" · "):"";
 return texto}
async function subir(f){if(!f)return;$("nombre").textContent="Leyendo "+f.name+"…";
 try{await fetch("/subir",{method:"POST",body:f});$("zona").classList.add("si");$("nombre").textContent=f.name+" ("+(f.size/1048576).toFixed(1)+" MB)";
  $("res").textContent="Revisando el respaldo…";const t=await correr(false);
  const m=t.match(/Se importar[^\n]*/);$("res").textContent=m?m[0]:"";$("log").hidden=true;$("datos").hidden=false;
  const s=await(await fetch("/estado")).json();$("servidor").value=s.conexion.servidor||"";if(!$("servidor").value)fetch("/detectar").then(r=>r.json()).then(d=>{if(d.servidor&&!$("servidor").value){$("servidor").value=d.servidor;$("hallado").textContent="Servidor FactPOS encontrado"+(d.empresa?" ("+d.empresa+")":"")+". Si no es el correcto, cámbielo."}else if(!d.servidor&&!$("servidor").value){$("hallado").textContent="No encontré un servidor en esta PC. Escriba la dirección de la PC donde está FactPOS Servidor (en ella: ipconfig › Dirección IPv4), con :3000 al final."}}).catch(()=>{});$("usuario").value=s.conexion.usuario||"";
 }catch{$("nombre").textContent="No se pudo leer el archivo"}}
$("zona").onclick=()=>$("arch").click();$("arch").onchange=e=>subir(e.target.files[0]);
$("zona").ondragover=e=>e.preventDefault();$("zona").ondrop=e=>{e.preventDefault();subir(e.dataTransfer.files[0])};
$("procesar").onclick=()=>{if(confirm("¿Cargar los datos a FactPOS ahora? Pruebe primero en una empresa de ensayo."))correr(true)};
</script></body></html>
