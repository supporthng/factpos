name: Instaladores

# Arma el instalador único de Windows y lo publica en GitHub › Releases:
#   FactPOS-Instalador.zip  → "INSTALAR FactPOS.bat" pregunta qué se instala:
#                             Servidor de la tienda, Caja, Servidor y caja, o Administración.
#
# - Cada cambio en main  → se actualiza la versión «Última» (siempre los mismos enlaces).
# - Una etiqueta v1.2.3  → además, una versión fija con su número.
# - También se puede correr a mano (Actions › Instaladores › Run workflow).
# Opcional: variable del repositorio PORTAL_URL (Settings › Secrets and variables ›
# Actions › Variables) con la dirección de su portal; si no, https://factpos.vercel.app.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  release:
    types: [published]   # versión creada desde GitHub › Releases › Draft a new release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instaladores:
    runs-on: windows-latest
    env:
      PORTAL_URL: ${{ vars.PORTAL_URL }}
      FACTPOS_REQUIERE_ESCRITORIO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preparar NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Número de versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: npm ci
      - name: Versión incremental de main
        if: github.ref == 'refs/heads/main'
        shell: bash
        # Cada publicación sube un décimo: 2.1, 2.2 … 2.9, 3.0 (3), 3.1 … 3.9, 4.0 (4)…
        # version.txt guarda "<versión inicial> <número de ejecución de esa publicación>" (p. ej. "2.1 113"); para saltar
        # a otra versión se cambian esos dos números. Internamente se escribe 2.1.0 (el instalador exige tres números).
        run: |
          read base corrida < version.txt
          k=$(( ${base%%.*} * 10 + ${base##*.} + GITHUB_RUN_NUMBER - corrida ))
          npm pkg set version="$(( k / 10 )).$(( k % 10 )).0"
      - run: npm run build
      - run: npm test
      - name: Compilar Electron
        shell: pwsh
        run: |
          npm install --prefix instalador/escritorio --no-audit --no-fund
          npm run dist:win --prefix instalador/escritorio
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Construir instalador integrado
        shell: pwsh
        run: |
          $env:PATH += ";${env:ProgramFiles(x86)}\NSIS"
          npm run empaquetar
      - name: Publicar artefactos de Windows
        uses: actions/upload-artifact@v4
        with:
          name: FactPOS-Instalador-Windows
          path: |
            paquete/FactPOS-Setup-*.exe
            paquete/FactPOS-Instalador-*.zip
          if-no-files-found: error
      - name: Publicar versión última
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f ultima "$GITHUB_SHA"
          git push -f origin refs/tags/ultima
          if gh release view ultima >/dev/null 2>&1; then
            gh release edit ultima --title "FactPOS · Última versión" --notes "Instalador Windows con Electron integrado ($GITHUB_SHA)"
          else
            gh release create ultima --title "FactPOS · Última versión" --notes "Instalador Windows con Electron integrado ($GITHUB_SHA)"
          fi
          gh release upload ultima paquete/FactPOS-Setup-*.exe paquete/FactPOS-Instalador-*.zip --clobber
          # Quitar los archivos de versiones anteriores: el portal solo debe ver la última
          VERSION=$(node -p "require('./package.json').version")
          # grep devuelve 1 cuando no queda nada que borrar: no es un error
          gh release view ultima --json assets -q '.assets[].name' | { grep -v -F "$VERSION" || true; } | while read -r a; do gh release delete-asset ultima "$a" -y || true; done
      - name: Publicar versión numerada
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" paquete/FactPOS-Setup-*.exe paquete/FactPOS-Instalador-*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" paquete/FactPOS-Setup-*.exe paquete/FactPOS-Instalador-*.zip --title "FactPOS $GITHUB_REF_NAME" --generate-notes
          fi
