name: Instaladores

# Arma el instalador único de Windows y lo publica en GitHub › Releases:
#   FactPOS-Instalador.zip  → "INSTALAR FactPOS.bat" pregunta qué se instala:
#                             Servidor de la tienda, Caja, Servidor y caja, o Administración.
#
# - Cada cambio en main  → se actualiza la versión «Última» (siempre los mismos enlaces).
# - Una etiqueta v1.2.3  → además, una versión fija con su número.
# - También se puede correr a mano (Actions › Instaladores › Run workflow).
# Opcional: variable del repositorio PORTAL_URL (Settings › Secrets and variables ›
# Actions › Variables) con la dirección de su portal; si no, https://factpos.vercel.app.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  release:
    types: [published]   # versión creada desde GitHub › Releases › Draft a new release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instaladores:
    runs-on: ubuntu-latest
    env:
      PORTAL_URL: ${{ vars.PORTAL_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: NSIS (para armar FactPOS-Setup.exe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Número de versión = etiqueta (v1.2.3 → 1.2.3)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run empaquetar

      - name: Nombres fijos
        run: |
          mkdir -p fijos
          cp paquete/FactPOS-Instalador-*.zip fijos/FactPOS-Instalador.zip
          cp paquete/FactPOS-Setup-*.exe fijos/FactPOS-Setup.exe
          ls -la paquete fijos

      - uses: actions/upload-artifact@v4
        with:
          name: FactPOS-Instalador
          path: fijos/*

      - name: Publicar en «Última»
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f ultima "$GITHUB_SHA"
          git push -f origin refs/tags/ultima
          NOTAS="Instalador de FactPOS armado del último cambio (${GITHUB_SHA::7}, $(date -u +'%Y-%m-%d %H:%M') UTC).

          Descargue **FactPOS-Setup.exe** y ábralo. Elija:
          1. Servidor principal del negocio (master)
          2. Servidor de una sucursal
          3. Caja (encuentra sola el servidor en la red local)
          4. Administración
          (FactPOS-Instalador.zip trae lo mismo para instalar a mano.)"
          if gh release view ultima >/dev/null 2>&1; then
            gh release edit ultima --title "FactPOS · Última versión" --notes "$NOTAS" --latest
          else
            gh release create ultima --title "FactPOS · Última versión" --notes "$NOTAS" --latest
          fi
          gh release upload ultima fijos/* --clobber

      - name: Publicar versión con número
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Los servidores de los clientes se actualizan desde estas versiones (el portal las ofrece)
        # Si la versión ya se creó a mano en GitHub › Releases, solo se le suben los archivos
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" paquete/*.zip paquete/*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" paquete/*.zip paquete/*.exe --title "FactPOS $GITHUB_REF_NAME" --generate-notes
          fi
