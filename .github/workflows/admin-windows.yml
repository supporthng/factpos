name: Admin Windows
# Compila Instalador_Admin_FactPOS.exe (administración remota) y lo publica en Releases › «admin-windows».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/admin-windows/**", ".github/workflows/admin-windows.yml"]
  pull_request:
    paths: ["apps/admin-windows/**", ".github/workflows/admin-windows.yml"]
permissions:
  contents: write
concurrency: { group: admin-windows, cancel-in-progress: false }
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", architecture: x64 }
      - name: Versión
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $f = "apps/admin-windows/admin.py"
          $t = Get-Content $f -Raw -Encoding utf8
          $t = $t -replace 'VERSION = "1\.0\.0"', "VERSION = `"$version`""
          Set-Content $f $t -Encoding utf8 -NoNewline
          Select-String -Path $f -Pattern '^VERSION ='
          "VERSION_APP=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Crear la app
        shell: pwsh
        run: ./apps/admin-windows/build_windows.ps1
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Construir instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION_APP" "apps\admin-windows\FactPOSAdmin.iss"
      - uses: actions/upload-artifact@v4
        with: { name: FactPOS-Admin-Windows, path: dist_instalador/Instalador_Admin_FactPOS.exe }
      - name: Publicar en Releases
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view admin-windows >/dev/null 2>&1 || gh release create admin-windows --title "FactPOS Admin para Windows" --notes "Descargue Instalador_Admin_FactPOS.exe y ejecútelo en la PC." --latest=false
          gh release upload admin-windows dist_instalador/Instalador_Admin_FactPOS.exe --clobber
          # Número de compilación vigente: lo leen las apps para actualizarse solas
          gh release edit admin-windows --notes "Descargue Instalador_Admin_FactPOS.exe y ejecútelo en la PC. build=${{ github.run_number }}"
