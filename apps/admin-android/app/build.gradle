plugins {
    id 'com.android.application'
}

// Firma: GitHub Actions deja la llave en ANDROID_KEYSTORE_PATH (desde el secreto ANDROID_KEYSTORE_B64).
// Con la MISMA llave siempre, cada APK nuevo se instala encima del anterior.
def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def codigo = (System.getenv("VERSION_CODE") ?: "1").toInteger()

android {
    namespace 'com.factpos.admin'
    compileSdk 34

    defaultConfig {
        applicationId 'com.factpos.admin'
        minSdk 21
        targetSdk 34
        versionCode codigo
        versionName "1.0.${codigo}"
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias(System.getenv("ANDROID_KEY_ALIAS") ?: "factpos")
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) { signingConfig signingConfigs.release }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
